server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
spring:
  application:
    name: zjj-picture-backend
  # 激活本地私有配置 application-local.yml（该文件已被 .gitignore 忽略，不会提交）
  profiles:
    active: local
  # 数据库配置
  # ShardingSphere 5.5.3 用「JDBC Driver + 独立 YAML」：数据源与分片规则全部写在 resources/sharding.yaml
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:sharding.yaml
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # Redis 配置
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
  # 开放更大的文件上传体积
  servlet:
    multipart:
      max-file-size: 10MB
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 控制台打印 SQL 日志，生产环境请关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 逻辑删除字段名
      logic-delete-value: 1 # 已删除
      logic-not-delete-value: 0 # 未删除
    enable-sql-runner: true
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "zjj-picture-backend 接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.zjj.zjjpicturebackend.controller
# ============================================================
# 以下密钥全部用占位符，真实值放在 application-local.yml（不提交）
# 或通过环境变量注入，禁止再写死在本文件里
# ============================================================
# 腾讯云 COS
cos:
  client:
    host: https://zjj-picture-save-1369308087.cos.ap-nanjing.myqcloud.com
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}
    region: ap-nanjing
    bucket: zjj-picture-save-1369308087
# 火山方舟（豆包 AI）
ai:
  doubao:
    api-key: ${ARK_API_KEY:}
# 阿里云百炼（DashScope）—— 文生图 / 图生图
aliYunAi:
  api-key: ${DASHSCOPE_API_KEY:}
  # 可选：工作空间专属域名，形如 https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com
  # 留空则使用通用域名 https://dashscope.aliyuncs.com（官方文档说明两者功能一致）
  base-url: ${DASHSCOPE_BASE_URL:}
  # 可选：qwen-image-3.0-pro / qwen-image-3.0 / qwen-image-2.1-pro
  model: ${DASHSCOPE_IMAGE_MODEL:qwen-image-3.0-pro}
# 动态分表开关
# 分片规则本身在 resources/sharding.yaml（ShardingSphere 5.4.1 的 Driver + YAML 方式，始终生效）；
# 这里只控制「是否动态创建分表 + 刷新数据节点」，默认关闭
sharding:
  dynamic:
    enabled: true

